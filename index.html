<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="أوامر التوزيع">
<meta name="theme-color" content="#1c6a54">
<title>أوامر التوزيع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%}html,body{min-height:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}

/* Layout: one working column — sticky header, tabs, then list or order sheet; tables fold into cards on phones */
:root{
  --bg:#eef2ef; --surface:#ffffff; --sunk:#f6f8f6; --ink:#16201b; --muted:#5a6a62; --line:#d6ded9;
  --accent:#1c6a54; --accent-ink:#ffffff; --accent-soft:#dfeee7;
  --warn:#9a5a0c; --warn-soft:#f7ead6; --danger:#b0342a; --danger-soft:#f7e1de; --ok:#25703a; --ok-soft:#dcefe0;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:10px; --shadow:0 1px 2px rgba(20,40,30,.06),0 6px 18px rgba(20,40,30,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1412; --surface:#16201c; --sunk:#111916; --ink:#e5ece8; --muted:#97a69f; --line:#2a3631;
  --accent:#4cb391; --accent-ink:#08130f; --accent-soft:#1a3029;
  --warn:#e2a24c; --warn-soft:#33281a; --danger:#e46b5f; --danger-soft:#3a1f1c; --ok:#6cc483; --ok-soft:#18301f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1412; --surface:#16201c; --sunk:#111916; --ink:#e5ece8; --muted:#97a69f; --line:#2a3631;
  --accent:#4cb391; --accent-ink:#08130f; --accent-soft:#1a3029;
  --warn:#e2a24c; --warn-soft:#33281a; --danger:#e46b5f; --danger-soft:#3a1f1c; --ok:#6cc483; --ok-soft:#18301f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto;min-width:0}
.brand h1{font-size:17px;white-space:nowrap}
.mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* buttons */
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--sunk);color:var(--ink)}
.btn.danger{color:var(--danger);border-color:var(--danger-soft)}
.btn.danger:hover{background:var(--danger-soft)}
.btn.danger.solid{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.wide{width:100%;justify-content:center;padding:11px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* tabs */
.tabs{display:flex;gap:4px;padding-block:14px 6px;overflow-x:auto}
.tab{appearance:none;border:0;background:transparent;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap;display:flex;gap:8px;align-items:center}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tab .cnt{font-size:12px;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:0 8px;color:var(--muted)}

main.page{padding-block:8px 48px;display:grid;gap:16px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar .grow{flex:1 1 220px;min-width:0}
input.in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;min-height:42px}
input.in:read-only{background:var(--sunk);color:var(--muted)}
textarea.in{min-height:70px;resize:vertical}
label.lb{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px}
.hint{font-size:12.5px;color:var(--muted);margin-top:4px;min-height:1em}
.hint.on{color:var(--accent)}
.hint.bad{color:var(--danger)}

/* order cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.ocard{appearance:none;text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px;cursor:pointer;display:grid;gap:10px;transition:border-color .15s,transform .15s}
.ocard:hover{border-color:var(--accent)}
.ocard .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ocard .no{font-family:var(--f-display);font-weight:600;font-size:18px}
.ocard .meta{font-size:13px;color:var(--muted)}
.ocard .note{font-size:13.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:8px;border-radius:99px;background:var(--sunk);border:1px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.full>i{background:var(--ok)}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:36px 20px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty h3{color:var(--ink);font-size:17px}

/* order sheet */
.sheet-head{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.sheet-head .t{flex:1 1 260px;min-width:0;display:grid;gap:4px}
.sheet-head h2{font-size:24px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sheet-head .meta{color:var(--muted);font-size:14px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;display:inline-block;white-space:nowrap;font-family:var(--f-body)}
.pill.open{background:var(--accent-soft);color:var(--accent)}
.pill.closed{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.part{background:var(--warn-soft);color:var(--warn)}
.pill.none{background:var(--sunk);color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--surface);padding:12px 14px}
.stat b{display:block;font-family:var(--f-display);font-size:22px;font-weight:600}
.stat span{font-size:12.5px;color:var(--muted)}
.stat.rem b{color:var(--warn)}
.stat.cart b{color:var(--accent)}
.banner{background:var(--ok-soft);color:var(--ok);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-weight:500}
.banner.err{background:var(--danger-soft);color:var(--danger)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel h3{font-size:15px;margin-bottom:12px}
.addform{display:grid;grid-template-columns:1fr 1.6fr .8fr 1.1fr .9fr auto;gap:10px;align-items:start}
.addform .go{padding-top:23px}

/* lines table */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table.lines{width:100%;border-collapse:collapse;font-size:14px}
table.lines th{font-size:12.5px;color:var(--muted);font-weight:600;text-align:start;padding:10px 12px;background:var(--sunk);border-bottom:1px solid var(--line);white-space:nowrap}
table.lines td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.lines tbody tr:last-child td{border-bottom:0}
table.lines .n{text-align:end;white-space:nowrap}
table.lines .k{font-weight:600;white-space:nowrap}
table.lines tfoot td{background:var(--sunk);font-weight:700;border-top:1px solid var(--line);border-bottom:0}
table.lines .act{white-space:nowrap;text-align:end}
.remv{color:var(--warn);font-weight:600}
.remv.z{color:var(--ok)}
.region-tag{display:inline-block;background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:1px 8px;font-size:13px}

@media (max-width:760px){
  .addform{grid-template-columns:1fr 1fr}
  .addform .f-desc,.addform .go{grid-column:1/-1}
  .addform .go{padding-top:0}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats .stat:last-child:nth-child(odd){grid-column:1/-1}
  .brand h1{font-size:15px}
}
@media (max-width:640px){
  .tbl-wrap{background:transparent;border:0;overflow:visible}
  table.lines,table.lines tbody,table.lines tfoot,table.lines tr,table.lines td{display:block;width:100%}
  table.lines thead{display:none}
  table.lines tbody tr{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;padding:8px 12px;display:grid;grid-template-columns:1fr 1fr;gap:2px 12px}
  table.lines td{border:0;padding:5px 0;display:flex;flex-direction:column;gap:1px}
  table.lines td::before{content:attr(data-label);font-size:11.5px;color:var(--muted);font-weight:600}
  table.lines td.wide,table.lines td.act{grid-column:1/-1}
  table.lines td.idx{display:none}
  table.lines .n{text-align:start}
  table.lines td.act{flex-direction:row;justify-content:flex-start;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
  table.lines td.act::before{display:none}
  table.lines tbody tr.sub{display:block;margin-top:-12px;border-top:0;border-radius:0 0 var(--r) var(--r);background:var(--sunk);padding:4px 12px 10px}
  table.lines tbody tr:has(+tr.sub){border-radius:var(--r) var(--r) 0 0;border-bottom:0}
  table.lines tr.sub td{display:block;padding:0;background:transparent;border:0}
  table.lines tr.sub td::before{display:none}
  .gt{font-size:13px}
  .gt .gr{grid-template-columns:1fr auto;gap:2px 10px;padding:8px 10px}
  .gt .gr.gh{display:none}
  .gt .gr .c-w{grid-column:1;grid-row:1;font-weight:600}
  .gt .gr .c-d{grid-column:1;grid-row:2;color:var(--muted);font-size:12px}
  .gt .gr .c-r{grid-column:1;grid-row:3;font-weight:600}
  .gt .gr .c-p{grid-column:1;grid-row:4;font-size:12.5px}
  .gt .gr .c-q{grid-column:2;grid-row:1/3;font-size:16px;align-self:center}
  .gt .gr .c-k{grid-column:2;grid-row:3;font-size:12px}
  .gt .gr .c-m{grid-column:2;grid-row:4;font-size:12.5px}
  .gt .gr em{display:inline}
  .gt .gr .c-p:has(.mut){visibility:hidden}
  .gt .gr .c-n{grid-column:1/-1;grid-row:5}
  .dr{grid-template-columns:1fr auto;gap:0 10px;padding:4px 0;border-top:1px dashed var(--line)}
  .dr .rg{font-weight:600}.dr .dt{grid-column:1}.dr .by{grid-column:2;text-align:end}
  table.lines tfoot tr{background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
  table.lines tfoot td{background:transparent;border:0;padding:4px 0}
  table.lines tfoot td.lbl{grid-column:1/-1}
  table.lines tfoot td:empty{display:none}
}

table.lines tr.sub td{background:var(--sunk);padding:4px 12px 12px;border-bottom:1px solid var(--line)}
table.lines tbody tr:has(+tr.sub) td{border-bottom:0}
.dl{display:grid;gap:4px;border-inline-start:3px solid var(--accent-soft);padding-inline-start:12px}
.dl-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-weight:600;padding:4px 0}
.rchip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:1px 10px;color:var(--ink);font-weight:500}
.rchip b{color:var(--accent)}
.dr{display:grid;grid-template-columns:130px minmax(90px,1fr) 80px minmax(0,2fr);gap:10px;font-size:13.5px;align-items:baseline}
.dr .dt,.dr .by{color:var(--muted);font-size:12.5px}.dr b{text-align:end}
.gt{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);font-size:13.5px}
.gr{display:grid;grid-template-columns:minmax(64px,.7fr) minmax(96px,1fr) minmax(80px,.9fr) minmax(80px,.9fr) minmax(90px,1.1fr) minmax(90px,1.1fr) minmax(80px,.9fr);gap:0 12px;padding:7px 12px;align-items:baseline;border-top:1px solid var(--line)}
.gr:nth-child(odd):not(.gh){background:var(--sunk)}
.gh{border-top:0;font-size:12px;font-weight:600;color:var(--muted);background:var(--accent-soft)}
.gr .c-k,.gr .c-q,.gr .c-m{text-align:end}
.gr .c-k{color:var(--muted)}
.gr .c-q{font-weight:600}.gh .c-q{font-weight:600}
.gr .c-d{color:var(--muted)}
.gr .c-m{color:var(--warn);font-weight:600}.gr .c-m.z{color:var(--ok)}.gh .c-m,.gh .c-k,.gh .c-d{color:var(--muted)}
.gr em{display:none;font-style:normal;color:var(--muted);font-weight:400}
.gr .c-p,.gr .c-r{min-width:0;overflow-wrap:anywhere}
.gr .c-n{grid-column:1/-1;font-size:12px;color:var(--muted);padding-top:2px;min-width:0;overflow-wrap:anywhere}
.edited{display:inline-block;font-size:11px;font-weight:600;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:0 7px;margin-inline-start:6px;white-space:nowrap}
.mut{color:var(--muted)}
.btn.fix-item{border-color:var(--accent);color:var(--accent)}
.btn.fix-dist{border-color:var(--warn);color:var(--warn)}
.btn .ico{width:16px;height:16px;flex:none}
.tagx{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:1px 9px;vertical-align:middle;margin-inline-end:6px}
.tagx.item{background:var(--accent-soft);color:var(--accent)}
.tagx.disp{background:var(--warn-soft);color:var(--warn)}
.dpick{display:grid;gap:6px;max-height:220px;overflow:auto}
.dpick button{appearance:none;text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;color:inherit;font:inherit}
.dpick button[aria-pressed="true"]{border-color:var(--warn);background:var(--warn-soft)}
.dpick small{display:block;color:var(--muted);font-size:12.5px}
.req{color:var(--danger);font-weight:700}
.dl-h{padding-bottom:6px}
@media (min-width:641px) and (max-width:1180px){
  table.lines td.act{white-space:normal;width:1%}
  table.lines td.act{vertical-align:middle}
  table.lines td.act .btn{display:flex;width:100%;justify-content:center;margin-block:2px;min-width:70px}
}
.regs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.rg-card{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:2px}
.rg-card .rg-n{font-weight:600}.rg-card b{font-family:var(--f-display);font-size:22px;color:var(--accent);font-weight:600}.rg-card small{color:var(--muted);font-size:12px;line-height:1.5}

/* login */
.login{min-height:100%;display:grid;place-items:center;padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 24px;box-shadow:var(--shadow);display:grid;gap:18px}
.login-card .mark{width:48px;height:48px;border-radius:12px}
.login-card h1{font-size:22px}
.login-card .sub{margin:4px 0 0;color:var(--muted);font-size:14px}
.seg{border:0;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg legend{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px;padding:0}
.seg label{border:1px solid var(--line);border-radius:9px;padding:10px;text-align:center;cursor:pointer;font-weight:600}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+span{color:var(--accent)}
.seg label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.forgot{margin-top:6px}.linkbtn{appearance:none;border:0;background:none;padding:2px 0;color:var(--accent);font-weight:600;font-size:13.5px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.ferr{color:var(--danger);font-size:13.5px;min-height:1.2em;font-weight:500}

/* modal */
.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(10,20,15,.45);display:flex;align-items:flex-end;justify-content:center;padding:env(safe-area-inset-top,0px) 0 0}
.modal{background:var(--surface);width:100%;max-width:520px;max-height:calc(100% - 24px);overflow:auto;border-radius:16px 16px 0 0;padding:20px max(18px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));display:grid;gap:14px;box-shadow:var(--shadow)}
@media (min-width:640px){.modal-bg{align-items:center}.modal{border-radius:14px;padding:22px}}
.modal h3{font-size:18px}
.modal .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal .foot{display:flex;gap:8px;justify-content:flex-start;flex-wrap:wrap;padding-top:4px}
.avail{background:var(--accent-soft);border-radius:10px;padding:14px 16px;display:grid;gap:2px}.avail span{font-size:13px;color:var(--muted);font-weight:600}.avail b{font-family:var(--f-display);font-size:30px;font-weight:600;color:var(--accent);line-height:1.2}.avail .sub{font-size:13px;color:var(--muted)}
.btn.icon span{display:inline}
@media (max-width:520px){.btn.icon span{display:none}.btn.icon{padding:6px 8px}}
.set{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.set-h{display:grid;gap:2px}.set-h small{color:var(--muted);font-size:13px}
.perms{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
.perm{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;font-size:14px}
.perm input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.perm:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.perm:has(input:disabled){cursor:default}
.nl-head{display:grid;gap:2px;border-top:1px solid var(--line);padding-top:12px}.nl-head small{color:var(--muted);font-size:12.5px}
.nl-rows{display:grid;gap:10px}
.nl-row{border:1px solid var(--line);border-radius:10px;padding:8px 12px 12px;background:var(--sunk)}
.nl-top{display:flex;justify-content:space-between;align-items:center}
.nl-n{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:12.5px;font-weight:700}
.nl-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}.nl-grid .nl-desc{grid-column:1/-1}
.nl-grid .hint{min-height:0}
@media (min-width:640px){.modal.wide{max-width:760px}.nl-grid{grid-template-columns:1fr 1.6fr .8fr}.nl-grid .nl-desc{grid-column:auto}}
.dp{display:grid;gap:8px}
.seg2{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg2 button{appearance:none;border:0;background:transparent;border-radius:8px;padding:7px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg2 button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.dp-row{display:grid;grid-template-columns:.8fr 1.4fr 1.1fr;gap:8px}
.dp-eq{font-size:13px;color:var(--muted)}.dp-eq b{color:var(--accent);font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;background:var(--sunk);border-radius:8px;padding:10px 12px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}
.hist{display:grid;gap:6px;max-height:220px;overflow:auto}
.hist .h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px;border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.hist .h small{color:var(--muted);display:block}
/* carts */
.cartbox{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:grid;gap:6px}
.cartbox:empty{display:none}
.cartbox .ct{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
.cartbox .cn{font-family:var(--f-display);font-size:22px;font-weight:600;color:var(--accent);line-height:1.2}
.cartbox .cd{font-size:13.5px}
.cartbox small{font-size:12.5px;color:var(--muted)}
.cartbox.off{color:var(--warn);background:var(--warn-soft);border-color:transparent;font-size:13px}
.carts{display:flex;gap:4px;flex-wrap:wrap}
.carts i{width:24px;height:16px;border-radius:4px;background:var(--accent);border:1.5px solid var(--accent)}
.carts i.p{background:linear-gradient(to left,var(--accent) var(--p),transparent var(--p))}
.cc b{color:var(--accent);font-family:var(--f-display);font-weight:600}
.cc small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;font-weight:400}
.miss{color:var(--warn);font-size:12.5px;font-weight:600}
.dcart{display:block;font-size:12px;color:var(--muted);font-weight:400}
.nl-grid .nl-full{grid-column:1/-1}
.cartwrap:empty{display:none}
.plan{display:grid;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.pl-h{display:grid;gap:1px}.pl-h small{color:var(--muted);font-size:12.5px}
.pl-cols,.pl-row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 38px;gap:8px;align-items:center}
.pl-cols{font-size:12.5px;font-weight:600;color:var(--muted)}
.pl-rows{display:grid;gap:6px}
.btn.pl-x{color:var(--danger);justify-content:center;padding:6px 0;min-height:38px}
.btn.pl-add{border-style:dashed;border-color:var(--accent);color:var(--accent);font-weight:600}
.pl-sum{display:flex;flex-wrap:wrap;gap:4px 14px;background:var(--accent-soft);border-radius:8px;padding:8px 12px;font-size:13.5px}.pl-sum:empty{display:none}
.pl-sum b{font-family:var(--f-display);color:var(--accent);font-weight:600}.pl-sum .ok{color:var(--ok);font-weight:600}.pl-sum .wa{color:var(--warn);font-weight:600}.pl-sum .bad{color:var(--danger);font-weight:600}

#toast{position:fixed;inset-inline:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:60;pointer-events:none;padding-inline:16px}
#toast div{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;font-size:14px;box-shadow:var(--shadow);max-width:520px}
#toast div.err{background:var(--danger);color:#fff}
.dbwarn{font-size:13.5px;background:var(--warn-soft);color:var(--warn);padding:10px 12px;border-radius:8px}
/* iPhone: no sideways drift, no zoom on focus */
html,body{overflow-x:hidden;max-width:100%}
html{touch-action:manipulation}
@media (max-width:640px){
  .tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));overflow:visible;gap:4px}
  .tab{justify-content:center;padding:8px 4px;font-size:13.5px;gap:5px;min-width:0}
  .tab .cnt{padding:0 6px}
  input.in,select.in,textarea.in{font-size:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div id="app" dir="rtl" lang="ar"></div>
<div id="modal" dir="rtl" lang="ar" hidden></div>
<div id="toast" dir="rtl" aria-live="polite"></div>
<datalist id="dl-items"></datalist>
<datalist id="dl-desc"></datalist>
<datalist id="dl-regions"></datalist>
<datalist id="dl-reps"></datalist>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
document.documentElement.lang='ar';document.documentElement.dir='rtl';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ROLES={admin:'المدير',user:'المستخدم'};
const DEF='000000';
const PERMS=[['create','إنشاء أمر جديد'],['add','أمر صرف (إضافة صنف للأمر)'],['dist','صرف الكميات'],['undo','التراجع عن الصرف'],['edit','تعديل الأوامر والأصناف'],['del','حذف'],['close','إنهاء الأمر وإعادة فتحه'],['export','تصدير Excel وطباعة'],['items','إدارة دليل الأصناف'],['backup','تنزيل نسخة احتياطية']];
const can=k=>S.role==='admin'||!(S.perms&&S.perms[k]===false);
const S={perms:null,db:null,dbState:'loading',role:null,loginRole:'admin',auth:null,authLoaded:false,items:new Map(),orders:[],ordersLoaded:false,tab:'open',orderId:null,q:'',region:'',mh:{},noKeep:false};

function nd(s){return String(s??'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).trim()}
function num(s){const v=Number(nd(s).replace(/,/g,'').replace('٫','.'));return String(s??'').trim()===''?NaN:(isFinite(v)?v:NaN)}
const r3=n=>Math.round(n*1000)/1000;
const fmt=n=>r3(n||0).toLocaleString('en-US');
const pad=n=>String(n).padStart(2,'0');
function today(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
const HFMT=(()=>{try{return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-arab',{year:'numeric',month:'numeric',day:'numeric'})}catch(e){return null}})();
function hijri(d){if(!(d instanceof Date)||isNaN(d))return '—';if(!HFMT)return d.toLocaleDateString('ar');const ps=HFMT.formatToParts(d),g=k=>((ps.find(p=>p.type===k)||{}).value||'');return `${g('year')}/${g('month')}/${g('day')}هـ`}
function fdate(s){if(!s)return '—';const [y,m,d]=String(s).split('-').map(Number);return d?hijri(new Date(y,m-1,d)):String(s)}
const HNUM=(()=>{try{return new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn',{year:'numeric',month:'numeric',day:'numeric'})}catch(e){return null}})();
const AD=n=>String(n).replace(/\d/g,c=>'٠١٢٣٤٥٦٧٨٩'[c]);
const GM=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const WD=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
function gfmt(d){return `${AD(d.getFullYear())}/${AD(d.getMonth()+1)}/${AD(d.getDate())}م`}
function fod(o){if(!o.date)return '—';if(o.cal!=='g')return fdate(o.date);const [y,m,d]=o.date.split('-').map(Number);return gfmt(new Date(y,m-1,d))}
function hParts(dt){const ps=HNUM.formatToParts(dt),g=k=>+((ps.find(p=>p.type===k)||{}).value||0);return{y:g('year'),m:g('month'),d:g('day')}}
const hIdx=(y,m,d)=>y*354.367+(m-1)*29.5306+d;
function hToG(y,m,d){const jd=Math.floor((11*y+3)/30)+354*y+30*m-Math.floor((m-1)/2)+d+1948440-385;
  const u=new Date((jd-2440588)*864e5);let dt=new Date(u.getUTCFullYear(),u.getUTCMonth(),u.getUTCDate(),12);
  for(let i=0;i<6;i++){const p=hParts(dt);if(p.y===y&&p.m===m&&p.d===d)return dt;const diff=Math.round(hIdx(y,m,d)-hIdx(p.y,p.m,p.d));if(!diff)break;dt.setDate(dt.getDate()+diff)}
  for(const k of [-1,1,-2,2]){const t=new Date(dt);t.setDate(t.getDate()+k);const p=hParts(t);if(p.y===y&&p.m===m&&p.d===d)return t}
  return null}
const hDays=(y,m)=>hToG(y,m,30)?30:29;
const DP={cal:'h',g:null};
function dpHtml(val,cal){return `<div class="dp" id="dp" data-val="${esc(val)}" data-cal="${esc(cal||'')}">
  <div class="seg2" role="group" aria-label="نوع التقويم"><button type="button" data-dpcal="h">هجري</button><button type="button" data-dpcal="g">ميلادي</button></div>
  <div class="dp-row"><select class="in" id="dp-d" aria-label="اليوم"></select><select class="in" id="dp-m" aria-label="الشهر"></select><select class="in" id="dp-y" aria-label="السنة"></select></div>
  <div class="dp-eq" id="dp-eq"></div></div>`}
function dpInit(val,cal){const [y,m,d]=String(val||today()).split('-').map(Number);DP.g=new Date(y,m-1,d,12);
  let c=cal;if(!c){try{c=localStorage.getItem('td-cal')}catch(e){}}DP.cal=(c==='g'||!HNUM)?'g':'h';dpRender()}
function dpRender(){const box=$('#dp');if(!box)return;const opt=(a,b,sel,lab)=>{let h='';for(let i=a;i<=b;i++)h+=`<option value="${i}" ${i===sel?'selected':''}>${lab?lab(i):i}</option>`;return h};
  box.querySelectorAll('[data-dpcal]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.dpcal===DP.cal));
  const g=DP.g,wd=WD[g.getDay()];
  if(DP.cal==='h'){const p=hParts(g);$('#dp-d').innerHTML=opt(1,hDays(p.y,p.m),p.d);$('#dp-m').innerHTML=opt(1,12,p.m);$('#dp-y').innerHTML=opt(p.y-5,p.y+5,p.y,i=>i+'هـ');
    $('#dp-eq').innerHTML=`يوافق <b>${g.getDate()} ${GM[g.getMonth()]} ${g.getFullYear()}م</b> · ${wd}`}
  else{const y=g.getFullYear(),m=g.getMonth()+1;$('#dp-d').innerHTML=opt(1,new Date(y,m,0).getDate(),g.getDate());$('#dp-m').innerHTML=opt(1,12,m,i=>GM[i-1]);$('#dp-y').innerHTML=opt(y-5,y+5,y,i=>i+'م');
    $('#dp-eq').innerHTML=`يوافق <b>${hijri(g)}</b> · ${wd}`}}
function dpChange(){const d=+v('dp-d'),m=+v('dp-m'),y=+v('dp-y');
  if(DP.cal==='h'){const t=hToG(y,m,Math.min(d,hDays(y,m)));if(t)DP.g=t}
  else DP.g=new Date(y,m-1,Math.min(d,new Date(y,m,0).getDate()),12);dpRender()}
const dpValue=()=>{const g=DP.g;return g.getFullYear()+'-'+pad(g.getMonth()+1)+'-'+pad(g.getDate())};
document.addEventListener('change',e=>{if(/^dp-[dmy]$/.test(e.target.id))dpChange()});
document.addEventListener('click',e=>{const b=e.target.closest('[data-dpcal]');if(!b)return;e.preventDefault();DP.cal=b.dataset.dpcal;try{localStorage.setItem('td-cal',DP.cal)}catch(x){}dpRender()});
function fdt(t){if(!t)return '—';return hijri(new Date(t))}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function itemId(no){return /^[A-Za-z0-9_\-~:@+]{1,150}$/.test(no)?'n_'+no:'h_'+[...new TextEncoder().encode(no)].map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,190)}
const v=id=>{const e=document.getElementById(id);return e?e.value:''};

function toast(msg,kind){const t=$('#toast');t.innerHTML=`<div class="${kind||''}">${esc(msg)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>t.innerHTML='',kind==='err'?5200:2600)}
function dbErr(e){const c=e&&e.code||'';
  if(c==='permission-denied')return 'ليست لديك صلاحية لهذا الإجراء، أو انتهت جلسة الدخول. سجّل الدخول مرة أخرى.';
  if(c==='resource-exhausted')return 'تم تجاوز الحد المسموح مؤقتاً. انتظر قليلاً ثم أعد المحاولة.';
  if(c==='unavailable'||c==='deadline-exceeded')return 'تعذّر الاتصال بالخادم. تحقق من الإنترنت وأعد المحاولة.';
  if(c==='auth/requires-recent-login')return 'لأمانك، سجّل الخروج ثم الدخول مرة أخرى قبل تغيير الرقم السري.';
  return (e&&e.message&&!c)?e.message:'حدث خطأ غير متوقع. أعد المحاولة.'}

/* ---------- session & auth ---------- */
const FB_CONFIG={apiKey:"AIzaSyAHNggucTd5PB-7yjIWLPCXA8B9pYWGIXA",authDomain:"tawzee-web.firebaseapp.com",projectId:"tawzee-web",storageBucket:"tawzee-web.firebasestorage.app",messagingSenderId:"805608003953",appId:"1:805608003953:web:b2e4f30cc6294df7463ed0"};
const EMAILS={admin:'iadelss12@gmail.com',user:'user@tawzee.app'};
const maskMail=m=>{const [u,d]=m.split('@');return u.slice(0,1)+'•••'+u.slice(-2)+'@'+d};
const roleOf=u=>u&&u.email?Object.keys(EMAILS).find(k=>EMAILS[k]===u.email.toLowerCase())||null:null;
function authErr(e){const c=e&&e.code||'';
  if(c==='auth/wrong-password'||c==='auth/invalid-credential'||c==='auth/invalid-login-credentials'||c==='auth/user-not-found')return 'الرقم السري غير صحيح.';
  if(c==='auth/too-many-requests')return 'محاولات كثيرة خاطئة. انتظر بضع دقائق ثم أعد المحاولة.';
  if(c==='auth/network-request-failed')return 'لا يوجد اتصال بالإنترنت.';
  if(c==='auth/weak-password')return 'الرقم السري الجديد يجب أن يكون ٦ خانات على الأقل.';
  return dbErr(e)}

/* ---------- writes ---------- */
const queues={};
function enqueue(k,fn){const p=(queues[k]||Promise.resolve()).then(fn);queues[k]=p.catch(()=>{});return p}
const getOrder=id=>S.orders.find(o=>o.id===id);
function mutateOrder(id,f){return enqueue('o:'+id,async()=>{const o=getOrder(id);if(!o)throw new Error('الأمر غير موجود');const patch=f(JSON.parse(JSON.stringify(o)));if(!patch)return;patch.updatedAt=Date.now();await S.db.collection('orders').doc(id).update(patch)})}

/* ---------- stats ---------- */
const dReg=(d,l)=>d.region===undefined?(l.region||''):(d.region||'');
const regLbl=x=>x||'بدون منطقة';
function regAgg(lines){const agg={};lines.forEach(l=>(l.dists||[]).forEach(d=>{const k=regLbl(dReg(d,l));const a=agg[k]=agg[k]||{q:0,n:0,last:0,items:new Set()};a.q+=+d.qty||0;a.n++;a.last=Math.max(a.last,d.at||0);a.items.add(l.itemNo)}));return agg}
const lDisp=l=>r3((l.dists||[]).reduce((a,d)=>a+(+d.qty||0),0));
const lRem=l=>r3((+l.qty||0)-lDisp(l));
function oStats(o){const ls=o.lines||[];const total=r3(ls.reduce((a,l)=>a+(+l.qty||0),0));const disp=r3(ls.reduce((a,l)=>a+lDisp(l),0));return{total,disp,rem:r3(total-disp),lines:ls.length,regions:new Set(ls.map(l=>l.region)).size,pct:total?Math.min(100,disp/total*100):0}}
/* ---------- carts ----------
   item.cap = pieces per cart (set when the item is created, editable from the item).
   Open orders follow the item's current cap. A dispense stores {cap,carts} at that moment.
   Closing an order stores line.cap so its record never changes afterwards. */
const capOf=no=>{const it=S.items.get(no);const c=it?+it.cap:0;return c>0?c:0};
const lCap=(l,o)=>o&&o.status==='closed'&&l.cap!==undefined?(+l.cap>0?+l.cap:0):capOf(l.itemNo);
function carts(q,cap){q=+q||0;cap=+cap||0;if(!(cap>0)||!(q>0))return null;const full=Math.floor(q/cap+1e-9);const rest=r3(q-full*cap);return{n:full+(rest>1e-9?1:0),full,rest:rest>1e-9?rest:0,cap}}
function cartTxt(c){if(!c)return '';if(!c.rest)return `${c.full} كاملة`;if(!c.full)return `عربة واحدة فيها ${fmt(c.rest)}`;return `${c.full} كاملة + 1 فيها ${fmt(c.rest)}`}
const cartN=n=>n===1?'عربة واحدة':n===2?'عربتان':n>=3&&n<=10?`${n} عربات`:`${n} عربة`;
const lCarts=(l,o)=>carts(lRem(l),lCap(l,o));
const oCarts=o=>(o.lines||[]).reduce((a,l)=>{const c=lCarts(l,o);return a+(c?c.n:0)},0);
function cartCell(l,o){const r=lRem(l);if(r<=0)return '<span class="mut">0</span>';const c=lCarts(l,o);if(!c)return '<span class="miss" title="سعة العربة غير محددة لهذا الصنف">غير محددة</span>';return `<b>${c.n}</b><small>${cartTxt(c)}</small>`}
function cartBox(q,cap,note){if(!(+q>0))return '';if(!(cap>0))return `<div class="cartbox off">سعة العربة غير محددة لهذا الصنف. حدّدها من تبويب «الأصناف» ليظهر عدد العربات.</div>`;const c=carts(q,cap);
  const vis=c.n<=40?`<div class="carts" aria-hidden="true">${'<i></i>'.repeat(c.full)}${c.rest?`<i class="p" style="--p:${Math.max(8,Math.round(c.rest/cap*100))}%"></i>`:''}</div>`:'';
  return `<div class="cartbox"><div class="ct"><span class="cn">${cartN(c.n)}</span><span class="cd">${cartTxt(c)}</span></div>${vis}<small>سعة العربة ${fmt(cap)}${note?' · '+note:''}</small></div>`}
const mkDist=(qty,region,note,cap,rp)=>{const c=carts(qty,cap);const d={qty:r3(qty),region,at:Date.now(),by:S.role,note:note||''};if(rp)d.rep=rp;if(c){d.cap=cap;d.carts=c.n}return d};
const dCartTxt=d=>{const c=carts(d.qty,d.cap);return c?`${cartN(c.n)} (${cartTxt(c)}) بسعة ${fmt(d.cap)}`:''};
const sortLines=ls=>[...ls].sort((a,b)=>(a.region||'').localeCompare(b.region||'','ar')||(a.itemNo||'').localeCompare(b.itemNo||'','ar',{numeric:true}));

/* ---------- render ---------- */
function render(){
  const app=$('#app');const keep={};let fid=null,ss=null,se=null;
  if(!S.noKeep){app.querySelectorAll('input[id]:not([type=radio]),select[id],textarea[id]').forEach(e=>keep[e.id]=e.value);const a=document.activeElement;if(a&&a.id&&app.contains(a)){fid=a.id;try{ss=a.selectionStart;se=a.selectionEnd}catch(x){}}}
  S.noKeep=false;
  app.innerHTML=S.role?appView():loginView();
  for(const id in keep){const e=document.getElementById(id);if(e)e.value=keep[id]}
  if(fid){const e=document.getElementById(fid);if(e){e.focus({preventScroll:true});try{if(ss!=null)e.setSelectionRange(ss,se)}catch(x){}}}
  syncDescLock();fillDatalists();
}
const MARK=`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/><path d="m7.5 5.2 9 4.6" opacity=".6"/></svg>`;
function loginView(){
  const ready=S.dbState==='ready';
  let warn='';
  if(S.dbState==='none')warn=`<div class="dbwarn">تعذّر تحميل خدمة البيانات. تحقق من الإنترنت ثم أعد تحميل الصفحة.</div>`;
  else if(!ready)warn=`<div class="hint">جارٍ الاتصال…</div>`;
  return `<main class="login"><div class="login-card">
    <div class="mark">${MARK.replace(/20/g,'26')}</div>
    <div><h1>أوامر التوزيع</h1><p class="sub">متابعة أوامر صرف المواد على المناطق</p></div>
    ${warn}

function regPanel(o){const agg=regAgg(o.lines||[]);const ks=Object.keys(agg).sort((a,b)=>agg[b].q-agg[a].q);if(!ks.length)return '';

function syncDescLock(prefix='f'){
  const no=document.getElementById(prefix+'-no'),de=document.getElementById(prefix+'-desc'),hi=document.getElementById(prefix+'-hint');if(!no||!de)return;
  const it=S.items.get(nd(no.value));

  if(free){if(de.readOnly){de.value=de.dataset.orig||it.desc}de.readOnly=false;if(hi){hi.textContent='يمكنك تعديل الوصف. إذا غيّرته يُحدَّث في دليل الأصناف والأوامر الجارية.';hi.className='hint on'}}
  else if(it){de.value=it.desc;de.readOnly=true;if(hi){hi.textContent='صنف مسجّل — الوصف ثابت لهذا الرقم';hi.className='hint on'}}
  else{if(de.readOnly){de.value='';}de.readOnly=false;if(hi){const h=noHint(no.value);if(h){hi.textContent=h[0];hi.className='hint'+(h[1]?' bad':'')}else{hi.textContent='رقم جديد — سيُسجَّل بهذا الوصف';hi.className='hint on'}}}
  const cw=document.getElementById(prefix+'-capw');if(cw)cw.hidden=!!it||!nd(no.value);
  updCart(prefix);
}
/* ---------- distribution plan: total first, then split over regions; each region becomes its own line ---------- */
const plRow=(r='',q='')=>`<div class="pl-row"><input class="in pl-r" list="dl-regions" autocomplete="off" placeholder="المنطقة" aria-label="المنطقة" value="${esc(r)}"><input class="in pl-q" inputmode="decimal" autocomplete="off" placeholder="الكمية" aria-label="كمية المنطقة" value="${esc(q)}"><button type="button" class="btn sm ghost pl-x" data-m="pl-del" aria-label="حذف المنطقة">✕</button></div>`;
const planHtml=p=>`<div class="plan" id="${p}-plan" data-p="${p}"><div class="pl-h"><b>خطة التوزيع</b><small>وزّع الكمية الإجمالية على المناطق حسب الأمر</small></div><div class="pl-cols" aria-hidden="true"><span>المنطقة <span class="req">*</span></span><span>الكمية <span class="req">*</span></span><span></span></div><div class="pl-rows">${plRow()}</div><div><button type="button" class="btn sm pl-add" data-m="pl-add">+ منطقة</button></div><div class="pl-sum" id="${p}-psum" aria-live="polite"></div></div>`;
const regN=n=>n===1?'منطقة واحدة':n===2?'منطقتان':n>=3&&n<=10?`${n} مناطق`:`${n} منطقة`;
const regKey=x=>normDesc(x).toLowerCase();
function readPlan(p){const box=document.getElementById(p+'-plan');const rows=[];const seen=new Set();let i=0;
  for(const r of box.querySelectorAll('.pl-row')){i++;const reg=r.querySelector('.pl-r').value.trim(),qs=r.querySelector('.pl-q').value.trim();if(!reg&&!qs)continue;
    if(!reg)return{err:`سطر المنطقة ${i}: اكتب اسم المنطقة.`};const q=num(qs);if(!(q>0))return{err:`اكتب كمية «${reg}» (أكبر من صفر).`};
    const k=regKey(reg);if(seen.has(k))return{err:`المنطقة «${reg}» مكررة في خطة هذا الصنف.`};seen.add(k);rows.push({region:reg,qty:r3(q)})}
  if(!rows.length)return{err:'وزّع الكمية على منطقة واحدة على الأقل.'};return{rows}}
function checkPlan(r,pl){const sum=r3(pl.rows.reduce((a,x)=>a+x.qty,0));return sum===r.qty?'':`مجموع المناطق (${fmt(sum)}) لا يساوي الكمية الإجمالية (${fmt(r.qty)}).`}
const planLines=(r,rows)=>{const g=uid();return rows.map(x=>({id:uid(),itemNo:r.no,desc:r.desc,qty:x.qty,region:x.region,grp:g,dists:[]}))};
function updPlan(p){const box=document.getElementById(p+'-psum');if(!box)return;const tot=num(v(p+'-qty'))||0;const no=nd(v(p+'-no'));const cap=S.items.has(no)?capOf(no):(readCap(p+'-cap')||0);let sum=0,n=0,cn=0;
  document.querySelectorAll(`#${p}-plan .pl-row`).forEach(r=>{const q=num(r.querySelector('.pl-q').value)||0;if(q>0){sum+=q;n++;const c=carts(q,cap);if(c)cn+=c.n}});sum=r3(sum);
  const diff=r3(tot-sum);const st=tot>0?(diff===0?'<span class="ok">✓ مكتمل التوزيع</span>':diff>0?`<span class="wa">متبقي للتوزيع ${fmt(diff)}</span>`:`<span class="bad">زيادة ${fmt(-diff)} عن الإجمالي</span>`):'';

$('#modal').addEventListener('click',e=>{const t=e.target.closest('[data-m]');if(!t)return;const k=t.dataset.m;

        try{const it=S.items.get(r.no);if(it&&r.no===l.itemNo&&normDesc(r.desc)!==normDesc(it.desc))await setItemDesc(it,r.desc);
          await ensureItem(r);await mutateOrder(o.id,od=>{const x=od.lines.find(y=>y.id===l.id);if((x.region||'')!==r.region)(x.dists||[]).forEach(z=>{if(dReg(z,x)===(x.region||''))z.region=r.region});Object.assign(x,{itemNo:r.no,desc:r.desc,qty:r.qty,region:r.region});return{lines:od.lines}});if(l.itemNo!==r.no)await cleanupItem(l.itemNo);after('تم حفظ الصنف')}catch(e){mErr(dbErr(e))}}});
    syncDescLock('m')},
  'del-line'(t){const o=getOrder(S.orderId);const l=(o.lines||[]).find(x=>x.id===t.dataset.l);if(!l)return;confirmBox('حذف الصنف من الأمر',`${l.itemNo} — ${l.desc} (${l.region}). سيُحذف مع سجل صرفه.`,'حذف',async()=>{await mutateOrder(o.id,od=>({lines:od.lines.filter(y=>y.id!==l.id)}));toast('حُذف الصنف')})},
  'new-item'(){openModal(`<h3>صنف جديد</h3><form novalidate style="display:grid;gap:12px"><div><label class="lb" for="m-ino">رقم الصنف</label><input class="in" id="m-ino" autocomplete="off" inputmode="numeric" maxlength="11" placeholder="22xxxxxxxxx"></div><div><label class="lb" for="m-idesc">الوصف</label><input class="in" id="m-idesc" autocomplete="off"></div>${capField('m-i')}<div class="ferr" id="m-err"></div><div class="foot"><button class="btn primary">إضافة</button><button type="button" class="btn" data-m="cancel">إلغاء</button></div></form>`,
    {ok:async()=>{const no=nd(v('m-ino')),desc=v('m-idesc').trim();if(!no||!desc)return mErr('اكتب رقم الصنف والوصف.');if(!NO_RE.test(no))return mErr(NO_MSG);{const ow=descOwner(desc,no);if(ow)return mErr(`الوصف «${ow.desc}» مسجّل برقم الصنف ${ow.itemNo}.`)}const ex=S.items.get(no);if(ex)return mErr(`رقم الصنف ${no} مسجّل مسبقاً بوصف «${ex.desc}».`);const cap=readCap('m-i-cap');if(!cap)return mErr(CAP_ERR);
      try{await S.db.collection('items').doc(itemId(no)).set({itemNo:no,desc,cap,createdAt:Date.now()});closeModal();toast('أُضيف الصنف')}catch(e){mErr(dbErr(e))}}})},
  'edit-item'(t){const it=S.items.get(t.dataset.no);if(!it)return;openModal(`<h3>تعديل الصنف ${esc(it.itemNo)}</h3><form novalidate style="display:grid;gap:12px"><div><label class="lb" for="m-idesc">الوصف</label><input class="in" id="m-idesc" value="${esc(it.desc)}" autocomplete="off"></div>${capField('m-i',+it.cap>0?it.cap:'')}<div class="hint">التعديل يُطبَّق على الأوامر الجارية فوراً. عمليات الصرف السابقة والأوامر المنتهية تبقى كما سُجّلت.</div><div class="ferr" id="m-err"></div><div class="foot"><button class="btn primary">حفظ</button><button type="button" class="btn" data-m="cancel">إلغاء</button></div></form>`,
    {ok:async()=>{const desc=v('m-idesc').trim();if(!desc)return mErr('اكتب الوصف.');{const ow=descOwner(desc,it.itemNo);if(ow)return mErr(`الوصف «${ow.desc}» مسجّل برقم الصنف ${ow.itemNo}.`)}const cap=readCap('m-i-cap');if(!cap)return mErr(CAP_ERR);
      const descCh=normDesc(desc)!==normDesc(it.desc);
      try{await S.db.collection('items').doc(it.id).update({cap});if(descCh)await setItemDesc(it,desc);closeModal();toast('تم حفظ الصنف')}catch(e){mErr(dbErr(e))}}})},
  'del-item'(t){const it=S.items.get(t.dataset.no);if(!it)return;confirmBox('حذف الصنف '+it.itemNo,`«${it.desc}» غير مستخدم في أي أمر، وسيُحذف من الدليل.`,'حذف',async()=>{await S.db.collection('items').doc(it.id).delete();toast('حُذف الصنف')})},
  'xlsx-one'(){const o=getOrder(S.orderId);exportXlsx([o],`أمر توزيع ${safeName(o.no)}.xlsx`)},

};
const safeName=s=>String(s).replace(/[\\/:*?"<>|]/g,'-').slice(0,60);

const CAP_HINT='كم قطعة من هذا الصنف تتسع لها العربة الواحدة.';
const capField=(p,val='')=>`<div><label class="lb" for="${p}-cap">سعة العربة</label><input class="in" id="${p}-cap" inputmode="numeric" autocomplete="off" value="${esc(val)}" placeholder="عدد القطع في العربة"><div class="hint">${CAP_HINT}</div></div>`;
function readCap(id){const c=num(v(id));if(!(c>0)||Math.floor(c)!==c)return NaN;return c}
const CAP_ERR='اكتب سعة العربة: عدد صحيح أكبر من صفر (كم قطعة في العربة الواحدة).';
const NO_RE=/^22\d{9}$/;
const NO_MSG='رقم الصنف يجب أن يكون 11 رقماً ويبدأ بـ 22، مثل 22536245785. تأكد من الرقم.';
const normDesc=x=>String(x||'').replace(/\s+/g,' ').trim();
function descOwner(desc,exceptNo){const k=normDesc(desc);return [...S.items.values()].find(i=>normDesc(i.desc)===k&&i.itemNo!==exceptNo)}
function noHint(val){const n=nd(val).replace(/\s/g,'');if(!n)return['',''];if(/\D/.test(n))return['أرقام فقط','bad'];if(!n.startsWith('22')&&n.length>=2)return['يجب أن يبدأ بـ 22','bad'];if(n.length<11)return[`${n.length} من 11 رقماً`,''];if(n.length>11)return[`${n.length} رقماً — الزيادة غير مقبولة`,'bad'];return null}
async function cleanupItem(no){if(!no||S.orders.some(o=>(o.lines||[]).some(l=>l.itemNo===no)))return;const it=S.items.get(no);if(it)try{await S.db.collection('items').doc(it.id).delete()}catch(e){}}
function readLine(p,freeNo,needReg){const no=nd(v(p+'-no')),desc=v(p+'-desc').trim(),qty=num(v(p+'-qty')),region=v(p+'-region').trim();
  if(!no)return{err:'اكتب رقم الصنف.'};if(!NO_RE.test(no))return{err:NO_MSG};if(!desc)return{err:'اكتب وصف الصنف.'};if(!(qty>0))return{err:'اكتب كمية أكبر من صفر.'};if(needReg&&!region)return{err:'اكتب المنطقة.'};
  const it=S.items.get(no);const free=!!it&&no===freeNo;if(it&&!free&&normDesc(it.desc)!==normDesc(desc))return{err:`رقم الصنف ${no} مسجّل بوصف «${it.desc}». الرقم لا يتكرر إلا بنفس الوصف.`};
  if(!it||free){const ow=descOwner(desc,no);if(ow)return{err:`الوصف «${ow.desc}» مسجّل برقم الصنف ${ow.itemNo}. استخدم نفس الرقم حتى لا يتكرر الصنف.`}}
  const cap=it?capOf(no):readCap(p+'-cap');if(!it&&!cap)return{err:`الصنف ${no} جديد. ${CAP_ERR}`};
  return{no,desc:it&&!free?it.desc:desc,qty:r3(qty),region,cap}}
async function setItemDesc(it,desc){await S.db.collection('items').doc(it.id).update({desc});
  for(const o of S.orders.filter(o=>o.status!=='closed'&&(o.lines||[]).some(l=>l.itemNo===it.itemNo)))await mutateOrder(o.id,od=>{od.lines.forEach(l=>{if(l.itemNo===it.itemNo)l.desc=desc});return{lines:od.lines}})}
async function ensureItem(r){if(!S.items.has(r.no))await S.db.collection('items').doc(itemId(r.no)).set({itemNo:r.no,desc:r.desc,cap:r.cap,createdAt:Date.now()})}

function addLineModal(){openModal(`<h3>أمر صرف — إضافة صنف</h3><form novalidate style="display:grid;gap:12px">
  <div class="grid2"><div><label class="lb" for="f-no">رقم الصنف</label><input class="in" id="f-no" list="dl-items" autocomplete="off" inputmode="numeric" maxlength="11" placeholder="22xxxxxxxxx"></div>
  <div><label class="lb" for="f-qty">الكمية الإجمالية</label><input class="in" id="f-qty" inputmode="decimal" autocomplete="off"></div></div>

async function addLine(){const o=getOrder(S.orderId);if(!o)return closeModal();mErr('');
  const r=readLine('f');if(r.err){mErr(r.err);return}
  const pl=readPlan('f');if(pl.err){mErr(pl.err);return}{const ce=checkPlan(r,pl);if(ce){mErr(ce);return}}
  {const ex=pl.rows.find(x=>(o.lines||[]).some(l=>l.itemNo===r.no&&regKey(l.region)===regKey(x.region)));if(ex){mErr(`المنطقة «${ex.region}» مضافة لهذا الصنف في الأمر من قبل. عدّلها من الإعدادات ← تصحيح الأوامر.`);return}}
  const lines=planLines(r,pl.rows);

    ['f-no','f-desc','f-qty','f-cap'].forEach(id=>{const e=document.getElementById(id);if(e){e.value='';e.readOnly=false}});resetPlan('f');syncDescLock();const fn=$('#f-no');if(fn)fn.focus();mErr('');toast(`أُضيف ${r.desc} على ${regN(lines.length)} — أضف صنفاً آخر أو أغلق`)}
  catch(e){mErr(dbErr(e))}finally{const b2=$('#f-go');if(b2)b2.disabled=false}}

const ICO_ITEM='<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/></svg>';
const ICO_DIST='<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h10M4 17h7"/><path d="m15 17 2 2 4-4"/></svg>';
function fixOrders(){return S.orders.filter(o=>o.status!=='closed'&&(o.lines||[]).length).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))}
function fixLineOpts(o){return sortLines(o.lines||[]).map(l=>`<option value="${esc(l.id)}" ${l.id===S.fixL?'selected':''}>${esc(l.itemNo)} — ${esc(l.desc)}${l.region?' — '+esc(l.region):''} (${(l.dists||[]).length} صرف)</option>`).join('')}
function fixSection(){const os=fixOrders();
  if(!os.length)return `<section class="set"><div class="set-h"><b>تصحيح الأوامر</b><small>لا توجد أوامر جارية فيها أصناف. لتصحيح أمر منتهٍ أعد فتحه أولاً.</small></div></section>`;
  if(!os.some(o=>o.id===S.fixO))S.fixO=(S.orderId&&os.some(o=>o.id===S.orderId))?S.orderId:os[0].id;
  const o=getOrder(S.fixO);
  return `<section class="set"><div class="set-h"><b>تصحيح الأوامر</b><small>لتصحيح خطأ في صنف داخل أمر، أو في عملية صرف سُجّلت. الأوامر المنتهية تُعاد فتحها أولاً.</small></div>
    <div><label class="lb" for="m-fo">الأمر</label><select class="in" id="m-fo">${os.map(x=>`<option value="${esc(x.id)}" ${x.id===S.fixO?'selected':''}>أمر ${esc(x.no)} — ${fod(x)}</option>`).join('')}</select></div>
    <div><label class="lb" for="m-fl">الصنف</label><select class="in" id="m-fl">${fixLineOpts(o)}</select></div>

$('#modal').addEventListener('change',e=>{const t=e.target;if(t.id==='m-fo'){S.fixO=t.value;S.fixL='';const fl=$('#m-fl');if(fl)fl.innerHTML=fixLineOpts(getOrder(t.value))}else if(t.id==='m-fl')S.fixL=t.value});
function distFix(oid,lid,sel,msg){const o=getOrder(oid);const l=o&&(o.lines||[]).find(x=>x.id===lid);if(!l)return openSettings('الصنف لم يعد موجوداً في الأمر.');
  const ds=l.dists||[];const d=sel!=null?ds[sel]:null;
  const head=`<h3><span class="tagx disp">تعديل عملية صرف</span>${esc(l.desc)}</h3><div class="hint" style="margin:0">أمر ${esc(o.no)} · رقم الصنف ${esc(l.itemNo)} · الكمية ${fmt(l.qty)} · المصروف ${fmt(lDisp(l))}</div>${msg?`<div class="banner">${esc(msg)}</div>`:''}`;
  if(!ds.length){openModal(head+`<div class="hint">لم يُسجَّل صرف لهذا الصنف بعد.</div><div class="foot"><button type="button" class="btn" data-m="back">رجوع للإعدادات</button></div>`,{back:()=>openSettings()});return}
  const maxQ=d?r3((+l.qty||0)-(lDisp(l)-(+d.qty||0))):0;
  openModal(head+`<div><div class="lb">اختر عملية الصرف</div><div class="dpick">${ds.map((x,i)=>({x,i})).reverse().map(({x,i})=>`<button type="button" data-m="pick" data-i="${i}" aria-pressed="${i===sel}"><div><b>${fmt(x.qty)}</b> ← ${esc(regLbl(dReg(x,l)))}${x.rep?' · '+esc(x.rep):''}${edMark(x)}<small>${dDay(x.at)} ${fdt(x.at)}</small></div><span class="mut">${i===sel?'محددة':'اختيار'}</span></button>`).join('')}</div></div>
    ${d?`<form novalidate style="display:grid;gap:12px">
      <div class="grid2"><div><label class="lb" for="m-eq">الكمية المصروفة</label><input class="in" id="m-eq" inputmode="decimal" value="${d.qty}" autocomplete="off" ${can('edit')?'':'readonly'}><div class="hint">الحد الأعلى ${fmt(maxQ)}</div></div>
      <div><label class="lb" for="m-er">المنطقة <span class="req" aria-hidden="true">*</span></label><input class="in" id="m-er" list="dl-regions" value="${esc(dReg(d,l))}" autocomplete="off" ${can('edit')&&!l.region?'':'readonly'}>${l.region?'<div class="hint">منطقة ثابتة من خطة التوزيع. إذا سُجّل الصرف على منطقة خاطئة احذف العملية واصرفها من سطر المنطقة الصحيحة.</div>':''}</div></div>
      <div class="grid2"><div><label class="lb" for="m-erep">المندوب</label><input class="in" id="m-erep" list="dl-reps" value="${esc(d.rep||'')}" autocomplete="off" ${can('edit')?'':'readonly'}></div>
      <div><label class="lb" for="m-en">ملاحظة</label><input class="in" id="m-en" value="${esc(d.note||'')}" autocomplete="off" ${can('edit')?'':'readonly'}></div></div>
      <div class="cartwrap" id="m-ecart" data-cap="${+d.cap||0}" data-max="${maxQ}"></div>
      <div class="ferr" id="m-err"></div>
      <div class="foot">${can('edit')?'<button class="btn primary">حفظ التعديل</button>':''}<button type="button" class="btn" data-m="back">رجوع</button>${can('undo')?'<button type="button" class="btn danger" data-m="deld" style="margin-inline-start:auto">حذف العملية</button>':''}</div></form>`
    :`<div class="ferr" id="m-err"></div><div class="foot"><button type="button" class="btn" data-m="back">رجوع للإعدادات</button></div>`}`,
  {pick:b=>distFix(oid,lid,+b.dataset.i),back:()=>openSettings(),
   ok:async()=>{if(!d||!can('edit'))return;const q=num(v('m-eq')),reg=v('m-er').trim();
     if(!(q>0))return mErr('اكتب الكمية المصروفة. لإلغاء العملية كاملة استخدم «حذف العملية».');
     if(q>maxQ+1e-9)return mErr(`الكمية أكبر من المسموح (${fmt(maxQ)})، لأن مجموع المصروف لا يتجاوز كمية الصنف.`);
     if(!reg)return mErr('اكتب المنطقة التي صُرفت لها الكمية.');
     try{await mutateOrder(o.id,od=>{const x=od.lines.find(y=>y.id===l.id);const y=x&&(x.dists||[])[sel];if(!y||y.at!==d.at)throw new Error('تغيّر سجل الصرف من جهاز آخر. ارجع واختر العملية من جديد.');
         const others=r3((x.dists||[]).reduce((a,z,k)=>a+(k===sel?0:+z.qty||0),0));if(others+q>(+x.qty||0)+1e-9)throw new Error('مجموع المصروف سيتجاوز كمية الصنف.');
         Object.assign(y,{qty:r3(q),region:reg,note:v('m-en').trim(),editedAt:Date.now(),editedBy:S.role});const rp=v('m-erep').trim();if(rp)y.rep=rp;else delete y.rep;
         if(+y.cap>0)y.carts=carts(q,+y.cap).n;return{lines:od.lines}});
       distFix(oid,lid,sel,'تم حفظ التعديل')}catch(e){mErr(dbErr(e))}},
   deld:async(b)=>{if(!d)return;if(!b.dataset.arm){b.dataset.arm='1';b.textContent='تأكيد حذف العملية';b.classList.add('solid');return}
     try{await mutateOrder(o.id,od=>{const x=od.lines.find(y=>y.id===l.id);const y=x&&(x.dists||[])[sel];if(!y||y.at!==d.at)throw new Error('تغيّر سجل الصرف من جهاز آخر. ارجع واختر العملية من جديد.');x.dists.splice(sel,1);return{lines:od.lines}});
       distFix(oid,lid,null,`حُذفت العملية وأُعيدت ${fmt(d.qty)} إلى الكمية المتوفرة`)}catch(e){mErr(dbErr(e))}}});
  if(d)updECart()}
function updECart(){const b=$('#m-ecart');if(!b)return;const q=num(v('m-eq'));const cap=+b.dataset.cap||0;const left=r3((+b.dataset.max||0)-(q||0));
  const h=cap>0&&q>0?cartBox(q,cap,`بالسعة المسجلة وقت الصرف · المتبقي بعد التعديل ${fmt(Math.max(0,left))}`):'';if(b.innerHTML!==h)b.innerHTML=h}

    <div class="perms">${PERMS.map(([k,l])=>`<label class="perm"><input type="checkbox" id="pm-${k}" ${pm[k]===false?'':'checked'} ${admin?'':'disabled'}><span>${l}</span></label>`).join('')}</div>

    <div id="m-restore"></div></section>

    <div><label class="lb" for="m-delo">الأمر</label><select class="in" id="m-delo"><option value="">اختر الأمر…</option>${[...S.orders].sort((x,y)=>(y.createdAt||0)-(x.createdAt||0)).map(o=>`<option value="${esc(o.id)}">أمر ${esc(o.no)} — ${o.status==='closed'?'منتهي':'جارٍ'} — ${fod(o)}</option>`).join('')}</select></div>
    <div><label class="lb" for="m-delc">للتأكيد اكتب رقم الأمر</label><input class="in" id="m-delc" autocomplete="off" inputmode="numeric"></div>

  ${admin?`<section class="set"><div class="set-h"><b>البدء من الصفر</b><small>يُنصح بتنزيل نسخة احتياطية قبل الحذف. الأرقام السرية والصلاحيات لا تُحذف.</small></div>
    ${S.orders.some(o=>o.id.startsWith('demo'))?`<div class="actions"><button type="button" class="btn" data-m="wipe-demo">حذف الأوامر التجريبية فقط (${S.orders.filter(o=>o.id.startsWith('demo')).length})</button></div>`:''}
    <div class="perms"><label class="perm"><input type="checkbox" id="wp-orders" checked><span>كل الأوامر (${S.orders.length})، الجارية والمنتهية</span></label>

  <div class="ferr" id="m-err"></div><div class="foot"><button type="button" class="btn" data-m="cancel">إغلاق</button></div>`,
  {pass:()=>ACT.chpass(),
   'fix-line':()=>{const o=getOrder(v('m-fo')),l=o&&(o.lines||[]).find(x=>x.id===v('m-fl'));if(!l)return mErr('اختر الأمر والصنف أولاً.');S.fixO=o.id;S.fixL=l.id;ACT['edit-line']({dataset:{o:o.id,l:l.id,from:'set'}})},
   'fix-dist':()=>{const o=getOrder(v('m-fo')),l=o&&(o.lines||[]).find(x=>x.id===v('m-fl'));if(!l)return mErr('اختر الأمر والصنف أولاً.');S.fixO=o.id;S.fixL=l.id;distFix(o.id,l.id,null)},
   delorder:async(b)=>{const id=v('m-delo');const o=getOrder(id);if(!o)return mErr('اختر الأمر الذي تريد حذفه.');if(nd(v('m-delc'))!==nd(o.no))return mErr(`اكتب رقم الأمر ${o.no} في خانة التأكيد.`);
     b.disabled=true;try{await enqueue('o:'+o.id,()=>S.db.collection('orders').doc(o.id).delete());if(S.orderId===o.id)S.orderId=null;S.noKeep=true;render();openSettings(`حُذف الأمر ${o.no}`)}catch(e){b.disabled=false;mErr(dbErr(e))}},
   'wipe-demo':async(b)=>{b.disabled=true;try{const demo=S.orders.filter(o=>o.id.startsWith('demo'));const nos=new Set(demo.flatMap(o=>(o.lines||[]).map(l=>l.itemNo)));
     for(const o of demo)await S.db.collection('orders').doc(o.id).delete();
     const used=new Set(S.orders.filter(o=>!o.id.startsWith('demo')).flatMap(o=>(o.lines||[]).map(l=>l.itemNo)));let ni=0;
     for(const no of nos){const it=S.items.get(no);if(it&&!used.has(no)){await S.db.collection('items').doc(it.id).delete();ni++}}
     S.orderId=null;S.noKeep=true;render();openSettings(`حُذفت ${demo.length} أوامر تجريبية و ${ni} صنفاً خاصاً بها`)}catch(e){b.disabled=false;mErr(dbErr(e))}},
   wipe:async(b)=>{const wo=$('#wp-orders').checked,wi=$('#wp-items').checked;if(!wo&&!wi)return mErr('اختر ما تريد حذفه.');if(v('m-wipe').trim()!=='حذف')return mErr('اكتب كلمة «حذف» في خانة التأكيد.');
     if(wi&&!wo&&S.orders.length)return mErr('لا يمكن حذف دليل الأصناف والأوامر موجودة. اختر حذف الأوامر أيضاً.');
     b.disabled=true;try{let no=0,ni=0;if(wo)for(const o of [...S.orders]){await S.db.collection('orders').doc(o.id).delete();no++}

   backup:()=>{const data={app:'tawzee',version:1,exportedAt:new Date().toISOString(),orders:S.orders.map(o=>({...o})),items:[...S.items.values()].map(i=>({...i})),perms:S.perms||null};

   'restore-go':async(b)=>{const bk=S.pendingRestore;if(!bk)return;b.disabled=true;const box=$('#m-restore');
     try{const keepO=new Set(bk.orders.map(o=>o.id)),keepI=new Set(bk.items.map(i=>i.id));let n=0;const tot=bk.orders.length+bk.items.length;

       for(const it of bk.items){const {id,...d}=it;await S.db.collection('items').doc(id).set(d);step()}
       for(const o of bk.orders){const {id,...d}=o;await S.db.collection('orders').doc(id).set(d);step()}

       for(const i of [...S.items.values()].filter(i=>!keepI.has(i.id)))await S.db.collection('items').doc(i.id).delete();

       S.pendingRestore=null;S.orderId=null;S.noKeep=true;render();openSettings(`تمت الاستعادة: ${bk.orders.length} أمر و ${bk.items.length} صنف`)}
     catch(e){b.disabled=false;mErr(dbErr(e))}}})}
$('#modal').addEventListener('change',e=>{if(e.target.id!=='m-file')return;const f=e.target.files&&e.target.files[0];if(!f)return;const box=$('#m-restore');
  const rd=new FileReader();rd.onload=()=>{let bk;try{bk=JSON.parse(rd.result)}catch(x){bk=null}
    const ok=bk&&bk.app==='tawzee'&&Array.isArray(bk.orders)&&Array.isArray(bk.items)&&bk.orders.every(o=>o&&typeof o.id==='string'&&/^[A-Za-z0-9_\-~:@+]{1,200}$/.test(o.id))&&bk.items.every(i=>i&&typeof i.id==='string'&&/^[A-Za-z0-9_\-~:@+]{1,200}$/.test(i.id));
    if(!ok){S.pendingRestore=null;box.innerHTML='<div class="ferr">هذا الملف ليس نسخة احتياطية صالحة من هذا البرنامج.</div>';return}
    S.pendingRestore=bk;box.innerHTML=`<div class="banner err" style="display:grid;gap:8px"><span>النسخة بتاريخ ${esc(fdt(Date.parse(bk.exportedAt)))}: ${bk.orders.length} أمر و ${bk.items.length} صنف. ستُستبدل كل البيانات الحالية بمحتوى النسخة، وتُحذف الأوامر غير الموجودة فيها.</span><div><button type="button" class="btn danger solid" data-m="restore-go">استبدال البيانات بالنسخة</button></div></div>`};
  rd.readAsText(f);e.target.value=''});

/* ---------- exports ---------- */
async function saveFile(name,data,okMsg){try{const blob=data instanceof Blob?data:new Blob([data],{type:name.endsWith('.json')?'application/json':'text/plain'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast(okMsg||'تم التنزيل')}catch(e){toast('تعذّر التنزيل.','err')}}
function exportXlsx(list,name){
  if(!window.XLSX){toast('تعذّر تحميل أداة Excel. تحقق من الإنترنت وأعد تحميل الصفحة.','err');return}
  const H=['رقم الأمر','تاريخ الأمر','الحالة','م','رقم الصنف','الوصف','المنطقة','الكمية','المصروف','المتبقي','سعة العربة','عربات المتبقي','تفصيل العربات'];const rows=[H];
  const H2=['رقم الأمر','رقم الصنف','الوصف','المنطقة','الكمية المصروفة','العربات','سعة العربة','التاريخ','بواسطة','المندوب','ملاحظة'];const rows2=[H2];
  list.forEach(o=>{sortLines(o.lines||[]).forEach((l,i)=>{const cap=lCap(l,o),c=lCarts(l,o);rows.push([o.no,fod(o),o.status==='closed'?'منتهي':'جارٍ',i+1,l.itemNo,l.desc,l.region,+l.qty,lDisp(l),lRem(l),cap||'غير محددة',c?c.n:(lRem(l)>0?'':0),cartTxt(c)]);
    (l.dists||[]).forEach(d=>rows2.push([o.no,l.itemNo,l.desc,regLbl(dReg(d,l)),+d.qty,d.cap?(d.carts||carts(d.qty,d.cap).n):'',d.cap||'',fdt(d.at),ROLES[d.by]||'',d.rep||'',d.note||'']))})});
  const t=list.reduce((a,o)=>{const s=oStats(o);a[0]+=s.total;a[1]+=s.disp;a[2]+=s.rem;a[3]+=oCarts(o);return a},[0,0,0,0]);
  rows.push([]);rows.push(['الإجمالي','','','','','','',r3(t[0]),r3(t[1]),r3(t[2]),'',t[3],'']);
  const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=[12,12,8,5,12,32,16,10,10,10,10,12,22].map(w=>({wch:w}));
  const ws2=XLSX.utils.aoa_to_sheet(rows2);ws2['!cols']=[12,12,32,16,14,9,10,18,10,18,24].map(w=>({wch:w}));
  // region summary
  const ag=regAgg(list.flatMap(o=>o.lines||[]));
  const rows3=[['المنطقة','الكمية المصروفة','عدد عمليات الصرف','عدد الأصناف','آخر صرف'],...Object.keys(ag).sort((a,b)=>a.localeCompare(b,'ar')).map(k=>[k,r3(ag[k].q),ag[k].n,ag[k].items.size,fdt(ag[k].last)])];
  const ws3=XLSX.utils.aoa_to_sheet(rows3);ws3['!cols']=[20,14,14,12,18].map(w=>({wch:w}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'الأصناف');XLSX.utils.book_append_sheet(wb,ws3,'ملخص المناطق');XLSX.utils.book_append_sheet(wb,ws2,'سجل الصرف');
  wb.Workbook={Views:[{RTL:true}]};
  const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});saveFile(name,new Blob([buf]),'تم تنزيل ملف Excel')}
function printHtml(o){const s=oStats(o);const ls=sortLines(o.lines||[]);const ag=regAgg(ls);
  const log=ls.flatMap(l=>(l.dists||[]).map(d=>({l,d}))).sort((x,y)=>(x.d.at||0)-(y.d.at||0));
  return `<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>أمر توزيع ${esc(o.no)}</title><style>

@media print{body{padding:0}}</style></head><body>

<div class="meta"><span>تاريخ الأمر: <b>${fod(o)}</b></span><span>الحالة: <b>${o.status==='closed'?'منتهي':'جارٍ'}</b></span><span>عدد الأصناف: <b>${s.lines}</b></span><span>عربات المتبقي: <b>${fmt(oCarts(o))}</b></span>${o.note?`<span>ملاحظات: <b>${esc(o.note)}</b></span>`:''}</div>
<h3>الأصناف</h3>
<table><thead><tr><th style="width:32px">م</th><th style="width:100px">رقم الصنف</th><th>الوصف</th><th style="width:90px">المنطقة</th><th style="width:75px">الكمية</th><th style="width:75px">المصروف</th><th style="width:75px">المتبقي</th><th style="width:130px">عربات المتبقي</th></tr></thead><tbody>
${ls.map((l,i)=>{const c=lCarts(l,o);return `<tr><td>${i+1}</td><td>${esc(l.itemNo)}</td><td>${esc(l.desc)}</td><td>${esc(l.region||'—')}</td><td>${fmt(l.qty)}</td><td>${fmt(lDisp(l))}</td><td>${fmt(lRem(l))}</td><td>${lRem(l)<=0?'0':c?`<b>${c.n}</b><br><small>${cartTxt(c)}</small>`:'غير محددة'}</td></tr>`}).join('')||'<tr><td colspan="8">لا توجد أصناف</td></tr>'}
</tbody><tfoot><tr><td colspan="4">الإجمالي</td><td>${fmt(s.total)}</td><td>${fmt(s.disp)}</td><td>${fmt(s.rem)}</td><td>${fmt(oCarts(o))}</td></tr></tfoot></table>
${Object.keys(ag).length?`<h3>الصرف حسب المنطقة</h3><table><thead><tr><th>المنطقة</th><th style="width:110px">الكمية المصروفة</th><th style="width:100px">عمليات الصرف</th><th style="width:130px">آخر صرف</th><th style="width:120px">توقيع المستلم</th></tr></thead><tbody>
${Object.keys(ag).map(k=>`<tr><td>${esc(k)}</td><td>${fmt(ag[k].q)}</td><td>${ag[k].n}</td><td>${fdt(ag[k].last)}</td><td></td></tr>`).join('')}</tbody></table>
<h3>تفاصيل الصرف</h3><table><thead><tr><th style="width:120px">التاريخ</th><th style="width:95px">رقم الصنف</th><th>الوصف</th><th style="width:100px">المنطقة</th><th style="width:75px">الكمية</th><th style="width:60px">العربات</th><th style="width:70px">بواسطة</th><th style="width:100px">المندوب</th><th>ملاحظة</th></tr></thead><tbody>
${log.map(({l,d})=>`<tr><td>${fdt(d.at)}</td><td>${esc(l.itemNo)}</td><td>${esc(l.desc)}</td><td>${esc(regLbl(dReg(d,l)))}</td><td>${fmt(d.qty)}</td><td>${d.cap?(d.carts||carts(d.qty,d.cap).n):'—'}</td><td>${ROLES[d.by]||''}</td><td>${esc(d.rep||'')}</td><td>${esc(d.note||'')}</td></tr>`).join('')}</tbody></table>`:''}
<div class="sig"><div>أمين المستودع</div><div>المسؤول عن التوزيع</div><div>المدير المعتمد</div></div>
<script>addEventListener('load',function(){setTimeout(function(){window.print()},400)})<\/script></body></html>`}

/* ---------- events ---------- */
document.addEventListener('click',e=>{const t=e.target.closest('#app [data-act]');if(!t)return;const f=ACT[t.dataset.act];if(f){e.preventDefault();const need=GUARD[t.dataset.act];if(need&&!can(need)){toast('ليست لديك صلاحية لهذا الإجراء.','err');return}f(t)}});
const GUARD={'new-order':'create','add-line':'add','edit-order':'edit','edit-line':'edit','del-order':'del','del-line':'del','close-order':'close',reopen:'close','xlsx-one':'export','xlsx-all':'export',print:'export','new-item':'items','edit-item':'items','del-item':'items'};
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='q'){S.q=t.value;render()}
  else if(t.id==='f-no'){syncDescLock()}
  else if(t.id==='f-desc'){const no=$('#f-no');if(no&&!nd(no.value)){const it=[...S.items.values()].find(i=>i.desc===t.value.trim());if(it){no.value=it.itemNo;syncDescLock()}}}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='rf'){S.region=t.value;render()}
  if(t.name==='lr'){S.loginRole=t.value;$('#lerr').textContent=''}});
document.addEventListener('submit',async e=>{const f=e.target;if(!$('#app').contains(f))return;e.preventDefault();
  if(f.id==='login-form'){const p=v('lp');if(!p){$('#lerr').textContent='اكتب الرقم السري.';return}
    const btn=$('#lgo');btn.disabled=true;$('#lerr').textContent='';
    try{await S.auth.signInWithEmailAndPassword(EMAILS[S.loginRole],nd(p))}catch(err){$('#lerr').textContent=authErr(err);const lp=$('#lp');if(lp)lp.select()}finally{const b=$('#lgo');if(b)b.disabled=false}}
});

/* ---------- boot ---------- */
let UNSUB=[];
function stopData(){UNSUB.forEach(f=>{try{f()}catch(e){}});UNSUB=[];S.orders=[];S.items=new Map();S.perms=null;S.ordersLoaded=false}
function startData(){const db=S.db;const onErr=e=>{if(S.role)toast(dbErr(e),'err')};
  UNSUB.push(db.collection('orders').onSnapshot(snap=>{S.orders=snap.docs.map(d=>({...d.data(),id:d.id}));S.ordersLoaded=true;render()},onErr));
  UNSUB.push(db.doc('config/perms').onSnapshot(d=>{S.perms=d.exists?d.data():null;render()},onErr));
  UNSUB.push(db.collection('items').onSnapshot(snap=>{S.items=new Map(snap.docs.map(d=>{const x=d.data();return [String(x.itemNo),{...x,id:d.id}]}));render()},onErr))}
function boot(){render();
  if(!window.firebase){S.dbState='none';render();return}
  firebase.initializeApp(FB_CONFIG);S.auth=firebase.auth();S.auth.languageCode='ar';S.db=firebase.firestore();
  S.auth.onAuthStateChanged(u=>{S.dbState='ready';stopData();const r=roleOf(u);
    if(u&&!r){S.auth.signOut();S.role=null;S.noKeep=true;render();return}
    const was=S.role;S.role=r;S.orderId=null;S.tab='open';S.q='';S.noKeep=true;
    if(r){startData();if(!was)toast('أهلاً، '+ROLES[r])}render()})}
boot();
